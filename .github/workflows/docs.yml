name: Documentation

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & deploy docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Check for docs project
        id: check
        run: |
          if [ -f docs/Project.toml ]; then
            echo "has_docs=true" >> $GITHUB_OUTPUT
          else
            echo "has_docs=false" >> $GITHUB_OUTPUT
            echo "No docs/Project.toml yet — skipping doc build."
          fi
      - name: Build docs
        if: steps.check.outputs.has_docs == 'true'
        shell: julia --color=yes --project=docs {0}
        run: |
          using Pkg
          # `[sources]` in docs/Project.toml pins the five docs deps to
          # their in-tree paths; `Pkg.instantiate` resolves the rest.
          # Don't `Pkg.develop` all of `packages/*` — it pulls in
          # LGMTuring/GMRFsPardiso/INLA which docs don't import and
          # whose stale compat pins have broken the build.
          Pkg.instantiate()
          # `shell:` scripts run from a temp dir, so `include` resolves
          # relative to that dir. Anchor at `pwd()` (the workspace root)
          # so `docs/make.jl` is found.
          include(joinpath(pwd(), "docs", "make.jl"))
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
